{% extends "base.html" %}
{% block title %}
    Login Page
{% endblock %}
{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="col-12 col-md-6 mx-auto mt-5">
                
                <h1 class="text-primary text-center">Login Page</h1>
                <div class="card">
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{form}}
                            <br/>
                            <button class="btn btn-primary">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
