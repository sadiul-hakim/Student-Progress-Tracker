{% load static %}
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>
		{% block title %}
			
		{% endblock %}
		</title>
		<link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
		<link rel="stylesheet" type="text/css" href="{% static 'css/app.css' %}">
	</head>
	<body class="bg-light">
		<nav class="navbar bg-body-tertiary fixed-top">
			<div class="container-fluid">
				<a class="navbar-brand text-primary d-flex align-items-center" href="{% url 'batch_page'%}">
					<img src="{% static 'images/progress.svg' %}" alt="logo" class="me-2" width="30px" height="30px" />
					<span>Progress Tracker</span>
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
				</button>
				<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
					<div class="offcanvas-header">
						<h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
					</div>
					<div class="offcanvas-body">
						<ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" href="{% url 'batch_page'%}">Batch</a>
							</li>
							<li class="nav-item">
								<a class="nav-link active" aria-current="page" href="{% url 'topic_page'%}">Topic</a>
							</li>
							{% if user.is_authenticated %}
								<li class="nav-item">
									<form method="post" action="{% url 'logout' %}" class="d-inline">
										{% csrf_token %}
										<button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
									</form>
								</li>
							{% else %}
								<li class="nav-item">
									<a class="nav-link active" aria-current="page" href="{% url 'login'%}">Login</a>
								</li>
							{% endif %}
						</ul>
					</div>
				</div>
			</div>
		</nav>
		<!-- Navbar Ends -->
		{% block content %}
			
		{% endblock %}
	</body>
	<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</html>
