{% extends "base.html" %}

{% block title %}
    Topic Page
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-primary my-3">Topic List</h1>
                <a class="btn btn-primary" href="{% url 'save_topic_page' 0 %}">Add</a>
            </div>
            {% for topic in topics %}
                <div class="col-12 col-md-3 mb-3">
                    <div class="card">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center">
                            <div class="flex-grow-1 d-flex align-items-center mb-2">
                                <span class="lead">{{topic.order}}. {{topic.name}}</span>
                            </div>
                            <div class="d-flex w-100 d-flex align-items-center justify-content-center">
                                <a class="btn btn-warning me-1" href="{% url 'save_topic_page' topic.id %}">Edit</a>
                                <a class="btn btn-danger me-1" href="{% url 'delete_topic' topic.id %}">Delete</a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
