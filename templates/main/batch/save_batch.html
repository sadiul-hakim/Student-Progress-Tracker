{% extends "base.html" %}

{% block title %}
    Add/Update Batch
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex align-items-center">
                <a class="btn btn-primary" href="{% url 'batch_page'%}">&#8592;</a>
            </div>
            <div class="mx-auto col-12 col-md-6">
                <h1 class="text-primary my-3">Add/Update Batch</h1>
                <div class="card">
                    <div class="card-body">
                        <form action="{% url 'save_batch'%}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="id" id="id" {% if batch %} value="{{batch.id}}" {% endif %}/>
                            <div>
                                <label name="name">Name</label>
                                <input type="text" name="name" id="name" class="form-control" placeholder="Enter Batch Name" {% if batch %}
                                    value="{{batch.name}}"
                                {% endif %} required/>
                            </div><br/>
                            <button type="submit" class="btn btn-primary">Add</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
