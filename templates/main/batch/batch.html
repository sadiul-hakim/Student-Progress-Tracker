{% extends "base.html" %}

{% block title %}
    Batch Page
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-primary my-3">Batch List</h1>
                <a class="btn btn-primary" href="{% url 'save_batch_page' 0 %}">Add</a>
            </div>
            {% for batch in batches %}
                <div class="col-12 col-md-4 mb-3">
                    <div class="card">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center">
                            <div class="mb-4 d-flex align-items-center">
                                <span class="lead">{{batch.name}}</span>
                            </div>
                            <div class="d-flex align-items-center justify-content-between w-100">
                                <a class="btn btn-info" href="{% url 'batch_progress' batch.id %}">Progress</a>
                                <a class="btn btn-primary" href="{% url 'student_page' batch.id %}">Students</a>
                                <a class="btn btn-warning" href="{% url 'save_batch_page' batch.id %}">Edit</a>
                                <a class="btn btn-danger" href="{% url 'delete_batch' batch.id %}">Delete</a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
