{% extends "base.html" %}

{% block title %}
    Batch Page
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-primary my-3">Batches List</h1>
                <a class="btn btn-primary" href="{% url 'save_batch_page' 0 %}">Add</a>
            </div>
            {% for batch in batches %}
                <div class="col-12 col-md-3 mb-3">
                    <div class="card">
                        <div class="card-body d-flex justify-content-center align-items-center">
                            <div class="flex-grow-1 d-flex align-items-center">
                                <span class="lead">{{batch.name}}</span>
                            </div>
                            <div class="d-flex flex-column">
                                <a class="btn btn-primary mb-2" href="{% url 'student_page' batch.id %}">Students</a>
                                <a class="btn btn-warning mb-2" href="{% url 'save_batch_page' batch.id %}">Edit</a>
                                <a class="btn btn-danger" href="{% url 'delete_batch' batch.id %}">Delete</a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
