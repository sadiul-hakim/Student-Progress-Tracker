{% extends "base.html" %}

{% block title %}
    Student Page
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex align-items-center">
                <a class="btn btn-primary" href="{% url 'batch_page'%}">&#8592;</a>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="text-primary my-3">Student List</h1>
                <a class="btn btn-primary" href="{% url 'save_student_page' b_id 0 %}">Add</a>
            </div>
            <table class="table table-striped">
              <thead class="table-dark">
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {% for student in students %}
                    <tr>
                        <td>None</td>
                        <td>{{student.name}}</td>
                        <td>
                            <button class="btn btn-info">Progress</button>
                            <a class="btn btn-warning" href="{% url 'save_student_page' b_id student.id %}">Edit</a>
                            <a class="btn btn-danger" href="{% url 'delete_student' student.id b_id %}">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
              </tbody>
            </table>
        </div>
    </div>
{% endblock content %}
