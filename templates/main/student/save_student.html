{% extends "base.html" %}

{% block title %}
    Add Student
{% endblock %}

{% block content %}
    <div class="container">
        <div class="row mt-5">
            <div class="d-flex align-items-center">
                <button class="btn btn-primary" onclick="window.history.back()">&#8592;</button>
            </div>
            <div class="mx-auto col-12 col-md-6">
                <h1 class="text-primary my-3">Add/Update Student</h1>
                <div class="card">
                    <div class="card-body">
                        <form action="{% url 'save_student'%}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="b_id" id="b_id" value="{{b_id}}"/>
                            <input type="hidden" name="s_id" id="s_id" {% if student %} value="{{student.id}}" {% endif %}/>
                            <div>
                                <label name="name">Name</label>
                                <input type="text" name="name" id="name" class="form-control" placeholder="Enter Student Name" {% if student %}
                                    value="{{student.name}}"
                                {% endif %} required/>
                            </div><br/>
                            <button type="submit" class="btn btn-primary">Add</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
